<div id="graph-lesson">
  <h3>Один граф, три алгоритма</h3>
  <div class="viz-controls">
    <label class="form-label" for="graph-algorithm">Алгоритм
      <select class="form-select" id="graph-algorithm">
        <option value="bfs">BFS · обход в ширину</option>
        <option value="dfs">DFS · обход в глубину</option>
        <option value="kruskal">Краскал · минимальный остов</option>
      </select>
    </label>
  </div>
  <div id="graph-drawing"></div>
  <div id="graph-legend" class="text-small text-muted"></div>
  <div class="viz-row">
    <button type="button" class="btn" id="graph-previous">Назад</button>
    <button type="button" class="btn btn-primary" id="graph-next">Шаг вперёд</button>
    <span id="graph-step" class="tabular-nums"></span>
  </div>
  <div class="graph-readout" aria-live="polite" aria-atomic="true">
    <div id="graph-action"></div>
    <div id="graph-memory"></div>
    <div id="graph-order"></div>
  </div>
</div>
<style>
  #graph-lesson { display: grid; gap: var(--font-size-base); }
  #graph-lesson .graph-readout { display: grid; gap: calc(var(--font-size-base) * .5); overflow-wrap: anywhere; }
  #graph-lesson .algorithm-graph { display: block; width: 100%; }
  #graph-lesson .algorithm-graph text { fill: var(--foreground); }
  #graph-lesson .graph-edge { stroke: var(--border); stroke-width: 1.5; }
  #graph-lesson .tree-edge { stroke: var(--viz-series-1); stroke-width: 4; }
  #graph-lesson .rejected-edge { stroke: var(--viz-series-2); stroke-width: 3; stroke-dasharray: 6 4; }
  #graph-lesson .graph-node { fill: var(--background); stroke: var(--muted-foreground); stroke-width: 1.5; }
  #graph-lesson .node-open { fill: color-mix(in srgb, var(--viz-series-1) 18%, var(--background)); }
  #graph-lesson .node-done { fill: var(--muted); }
  #graph-lesson .node-current { fill: none; stroke: var(--viz-series-1); stroke-width: 2; }
  #graph-lesson .edge-weight { paint-order: stroke; stroke: var(--background); stroke-width: 6; stroke-linejoin: round; }
</style>
<script>
(() => {
  const root = document.getElementById('graph-lesson');
  const select = root.querySelector('#graph-algorithm');
  const drawing = root.querySelector('#graph-drawing');
  const previous = root.querySelector('#graph-previous');
  const next = root.querySelector('#graph-next');
  const stepLabel = root.querySelector('#graph-step');
  const actionLabel = root.querySelector('#graph-action');
  const memoryLabel = root.querySelector('#graph-memory');
  const orderLabel = root.querySelector('#graph-order');
  const legend = root.querySelector('#graph-legend');
  const vertices = [1, 2, 3, 4, 5, 6, 7];
  const edges = [[1, 2, 7], [1, 3, 6], [2, 4, 1], [2, 7, 8],
                 [3, 5, 2], [3, 7, 5], [5, 6, 3], [6, 7, 4]];
  const adjacent = Object.fromEntries(vertices.map(vertex => [vertex, []]));
  for (const [left, right] of edges) {
    adjacent[left].push(right);
    adjacent[right].push(left);
  }
  for (const neighbors of Object.values(adjacent)) neighbors.sort((a, b) => a - b);
  const edgeId = (left, right) => `${Math.min(left, right)}–${Math.max(left, right)}`;
  const copy = value => JSON.parse(JSON.stringify(value));

  function makeBfs() {
    const states = [];
    const colors = Object.fromEntries(vertices.map(vertex => [vertex, 0]));
    const queue = [1];
    const order = [1];
    const tree = [];
    colors[1] = 1;
    const record = (action, current) => states.push(copy({ colors, queue, order, tree, action, current }));
    record('Старт · вершина 1 в очереди', 1);
    while (queue.length) {
      const current = queue.shift();
      const added = [];
      for (const neighbor of adjacent[current]) {
        if (colors[neighbor] === 0) {
          colors[neighbor] = 1;
          queue.push(neighbor);
          order.push(neighbor);
          tree.push(edgeId(current, neighbor));
          added.push(neighbor);
        }
      }
      colors[current] = 2;
      record(`Обработана ${current} · новые вершины ${added.join(', ') || 'отсутствуют'}`, current);
    }
    return states;
  }

  function makeDfs() {
    const states = [];
    const colors = Object.fromEntries(vertices.map(vertex => [vertex, 0]));
    const stack = [];
    const order = [];
    const tree = [];
    const record = (action, current) => states.push(copy({ colors, stack, order, tree, action, current }));
    function visit(vertex, parent) {
      colors[vertex] = 1;
      stack.push(vertex);
      order.push(vertex);
      if (parent !== null) tree.push(edgeId(parent, vertex));
      record(parent === null ? 'Старт · вход в 1' : `Вход в ${vertex} из ${parent}`, vertex);
      for (const neighbor of adjacent[vertex]) {
        if (colors[neighbor] === 0) visit(neighbor, vertex);
      }
      colors[vertex] = 2;
      stack.pop();
      const current = stack.length ? stack[stack.length - 1] : null;
      record(current === null ? 'Выход из 1 · обход завершён' : `Выход из ${vertex} · возврат в ${current}`, current);
    }
    visit(1, null);
    return states;
  }

  function makeKruskal() {
    const states = [];
    const parents = Object.fromEntries(vertices.map(vertex => [vertex, vertex]));
    const tree = [];
    let total = 0;
    const find = vertex => {
      while (parents[vertex] !== vertex) vertex = parents[vertex];
      return vertex;
    };
    const record = (action, rejected = null) => states.push(copy({ tree, total, action, rejected }));
    record('Начало · 7 отдельных вершин');
    for (const [left, right, weight] of [...edges].sort((a, b) => a[2] - b[2])) {
      const leftRoot = find(left);
      const rightRoot = find(right);
      const id = edgeId(left, right);
      if (leftRoot === rightRoot) {
        record(`Ребро ${id}, вес ${weight} · пропуск, замыкает цикл`, id);
      } else {
        parents[leftRoot] = rightRoot;
        tree.push(id);
        total += weight;
        record(`Ребро ${id}, вес ${weight} · добавлено`);
      }
      if (tree.length === vertices.length - 1) break;
    }
    return states;
  }

  const histories = { bfs: makeBfs(), dfs: makeDfs(), kruskal: makeKruskal() };
  let algorithm = 'bfs';
  let step = 0;

  function restore(snapshot) {
    const saved = snapshot?.privateContent?.graphLesson;
    if (!saved || !Object.prototype.hasOwnProperty.call(histories, saved.algorithm)) return;
    algorithm = saved.algorithm;
    step = Number.isInteger(saved.step) ? Math.max(0, Math.min(saved.step, histories[algorithm].length - 1)) : 0;
  }

  function save() {
    if (!window.openai?.setWidgetState) return;
    window.openai.setWidgetState({
      modelContent: { graphLesson: { algorithm, step } },
      privateContent: { graphLesson: { algorithm, step } }
    }).catch(() => {});
  }

  function drawGraph(state) {
    const width = drawing.getBoundingClientRect().width || 320;
    const positions = {
      1: [.44, 32], 2: [.14, 114], 3: [.76, 114],
      4: [.04, 204], 7: [.44, 204], 5: [.92, 204], 6: [.68, 284]
    };
    const point = vertex => [32 + positions[vertex][0] * (width - 64), positions[vertex][1]];
    let markup = `<svg class="algorithm-graph" width="${width}" height="315" viewBox="0 0 ${width} 315" role="img" aria-labelledby="graph-svg-title graph-svg-description">`;
    markup += '<title id="graph-svg-title">Граф из семи вершин</title>';
    markup += `<desc id="graph-svg-description">${state.action}. Выбранные рёбра ${state.tree.join(', ') || 'отсутствуют'}. Все рёбра графа: 1–2, 1–3, 2–4, 2–7, 3–5, 3–7, 5–6, 6–7.</desc>`;
    for (const [left, right, weight] of edges) {
      const [x1, y1] = point(left);
      const [x2, y2] = point(right);
      const id = edgeId(left, right);
      const selected = state.tree.includes(id);
      const rejected = state.rejected === id;
      const edgeClass = rejected ? 'rejected-edge' : selected ? 'tree-edge' : 'graph-edge';
      markup += `<line class="${edgeClass}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />`;
      if (algorithm === 'kruskal') {
        const length = Math.hypot(x2 - x1, y2 - y1);
        const x = (x1 + x2) / 2 - (y2 - y1) / length * 11;
        const y = (y1 + y2) / 2 + (x2 - x1) / length * 11;
        markup += `<text class="edge-weight" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${weight}</text>`;
      }
    }
    for (const vertex of vertices) {
      const [x, y] = point(vertex);
      const color = state.colors?.[vertex] || 0;
      const status = algorithm === 'dfs' ? ['Б', 'С', 'Ч'][color] : ['·', 'О', 'Г'][color];
      const nodeClass = color === 1 ? 'node-open' : color === 2 ? 'node-done' : '';
      if (state.current === vertex) markup += `<circle class="node-current" cx="${x}" cy="${y}" r="22" />`;
      markup += `<circle class="graph-node ${nodeClass}" cx="${x}" cy="${y}" r="17" />`;
      markup += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${vertex}</text>`;
      if (algorithm !== 'kruskal') markup += `<text class="text-small" x="${x + 26}" y="${y}" dominant-baseline="central">${status}</text>`;
    }
    drawing.innerHTML = markup + '</svg>';
  }

  function render() {
    const history = histories[algorithm];
    const state = history[step];
    select.value = algorithm;
    previous.disabled = step === 0;
    next.disabled = step === history.length - 1;
    stepLabel.textContent = `${step} / ${history.length - 1}`;
    actionLabel.textContent = state.action;
    if (algorithm === 'kruskal') {
      legend.textContent = 'Толстые рёбра — остов · пунктир — пропущенное ребро';
      memoryLabel.textContent = `Принято рёбер · ${state.tree.length} из 6 · общий вес ${state.total}`;
      orderLabel.textContent = `Рёбра остова · ${state.tree.join(', ') || 'пока нет'}`;
    } else {
      const bfs = algorithm === 'bfs';
      legend.textContent = bfs
        ? 'О — в очереди · Г — обработана · кольцо — текущая · толстые рёбра — дерево'
        : 'Б — белая · С — серая · Ч — чёрная · кольцо — текущая · толстые рёбра — дерево';
      const memory = bfs ? state.queue : state.stack;
      memoryLabel.textContent = `${bfs ? 'Очередь, начало слева' : 'Цепочка возврата, текущая справа'} · ${memory.join(' → ') || 'пуста'}`;
      orderLabel.textContent = `Порядок обнаружения · ${state.order.join(', ')}`;
    }
    drawGraph(state);
  }

  select.addEventListener('change', () => {
    algorithm = select.value;
    step = 0;
    render();
    save();
  });
  previous.addEventListener('click', () => {
    if (step > 0) { step -= 1; render(); save(); }
  });
  next.addEventListener('click', () => {
    if (step < histories[algorithm].length - 1) { step += 1; render(); save(); }
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) {
      restore(event.detail.globals.widgetState);
      render();
    }
  });
  restore(window.openai?.widgetState);
  render();
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => drawGraph(histories[algorithm][step])).observe(drawing);
  } else {
    window.addEventListener('resize', () => drawGraph(histories[algorithm][step]));
  }
})();
</script>
